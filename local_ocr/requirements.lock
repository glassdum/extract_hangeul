# Stage 1~3(입력·기본 OCR, 전처리 탐색, 교차 판독) 통합 테스트에 실제로
# 사용해 검증한 고정 버전. 생성: python3.12 -m venv .venv && pip install -r
# requirements.lock 로 재현.
#
# 문서 "초기 Python 패키지 계획"에 있지만 이 단계 코드가 아직 쓰지 않는
# onnxruntime(배포 추론), PySide6(검토 GUI)는 여기 포함하지 않았다 — 해당
# 단계 구현 시 이 파일도 함께 갱신한다.
#
# 참고: opencv-contrib-python은 paddleocr/paddlex의 전이 의존성으로 자동
# 설치된 것이며, pyproject.toml에 명시한 opencv-python 대신 이것이 깔린다
# (둘 다 `cv2` 모듈을 제공하므로 기능상 문제는 없다). Stage 2의 전처리
# 보정본(Deskew/CLAHE/이진화/확대 등)이 실제로 cv2를 사용한다.
#
# pytesseract는 파이썬 바인딩일 뿐이다 — 시스템에 Tesseract 5 바이너리와
# kor/eng 언어 데이터가 별도로 설치돼 있어야 한다
# (Ubuntu/Debian: apt install tesseract-ocr tesseract-ocr-kor).

