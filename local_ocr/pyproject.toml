[project]
name = "local-ocr"
version = "0.1.0"
description = "CPU 기반 완전 로컬 범용 OCR 프로그램 (인쇄체·손글씨, 한글/영어/숫자)"
requires-python = ">=3.12,<3.13"
readme = "README.md"

# 문서 "초기 Python 패키지 계획" 표를 그대로 반영한 전체 프로젝트 의존성.
# 현재(Stage 1~3, 5, 6) 코드가 실제로 쓰는 것: paddleocr/paddlepaddle/
# PyMuPDF/Pillow/pillow-heif/opencv-python(Stage 1~2), pytesseract(Stage 3),
# PySide6(Stage 6, review/). onnxruntime(배포 추론)만 아직 코드가 없다.
# rapidfuzz는 앙상블 문자열 비교에 쓸 후보였지만, 실제로는 표준 라이브러리
# difflib만으로 충분해(ensemble.cross_check) 아직 안 쓴다.
# 정확한 고정 버전은 requirements.lock을 따른다 (문서 "버전 정책").
dependencies = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "onnxruntime==1.29.0",
    "opencv-python==4.14.0.94",
    "PyMuPDF==1.28.2",
    "PySide6==6.11.2",
    "Pillow>=11,<13",
    "pillow-heif>=0.20",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "resources/handwriting_training"]
testpaths = ["tests"]
