[project]
name = "local-ocr"
version = "0.1.0"
description = "CPU 기반 완전 로컬 범용 OCR 프로그램 (인쇄체·손글씨, 한글/영어/숫자)"
requires-python = ">=3.12,<3.13"
readme = "README.md"

# 문서 "초기 Python 패키지 계획" 표를 그대로 반영한 전체 프로젝트 의존성.
# 현재(Stage 1~3, 5~7) 코드가 실제로 쓰는 것: paddleocr/paddlepaddle/
# PyMuPDF/Pillow/pillow-heif/opencv-python(Stage 1~2), pytesseract(Stage 3),
# PySide6(Stage 6, review/). 해시 캐시(Stage 7)는 표준 라이브러리 sqlite3/
# hashlib만 쓴다. onnxruntime은 `PipelineConfig.inference_backend =
# "onnxruntime"`로 전환하는 코드까지는 연결했지만(paddleocr가 내부적으로
# `is_dep_available("onnxruntime")`을 확인하고 없으면 스스로 명확한
# RuntimeError를 던진다), 실제 onnx 변환 모델을 구할 수 없는 이 환경에서는
# 그 경로로 추론까지 검증하지 못했다 — 기본값은 여전히 "paddle"이다.
# rapidfuzz는 앙상블 문자열 비교에 쓸 후보였지만, 실제로는 표준 라이브러리
# difflib만으로 충분해(ensemble.cross_check) 아직 안 쓴다.
# 정확한 고정 버전은 requirements.lock을 따른다 (문서 "버전 정책").
dependencies = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "onnxruntime==1.29.0",
    "opencv-python==4.14.0.94",
    "PyMuPDF==1.28.2",
    "PySide6==6.11.2",
    "Pillow>=11,<13",
    "pillow-heif>=0.20",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "resources/handwriting_training"]
testpaths = ["tests"]
